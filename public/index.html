<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>봄맞이 회식 장소 설문조사</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>🌸 봄맞이 회식 장소 설문조사</h1>
      <p class="description">
        삼성전자 DSR 사업장 주변에서 원하는 메뉴를 고르면, 카카오지도로 추천 식당을 확인할 수 있어요.
      </p>

      <section class="survey-card">
        <label for="menuSelect">메뉴 카테고리 선택</label>
        <select id="menuSelect">
          <option value="">-- 메뉴를 골라주세요 --</option>
        </select>
        <button id="searchButton">추천 식당 찾기</button>
      </section>

      <section id="map" class="map"></section>

      <section class="result-card">
        <h2>추천 식당 목록</h2>
        <ul id="placeList"></ul>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
